name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test + tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Pure source scan, no secrets — so unlike catalog-state below it is
      # safe to run on pull_request, which is where token drift is introduced.
      - run: pnpm tokens:check
      # Also a pure source scan: the runbook page is generated from the array
      # run-round.ts executes, so this fails when the two drift.
      - run: pnpm runbook:check
      # Cross-references into the docs: every anchor resolves, and nothing
      # cites an architecture section by number again. Reads only tracked
      # files, so like the two above it belongs on pull_request, which is
      # where a reference breaks.
      - run: pnpm docs:links
      # The pipeline's mechanical invariants — a stamp with no writer, a stamp
      # that outruns its finding, a guard that can never fire, a trap with no
      # test, a script nothing references, a seeder forking the synonym table.
      # Same category as the three above: source text only, no secrets, and a
      # PR is where every one of those shapes gets introduced. Its escape
      # hatches are ratchets, so a green run still prints what is left.
      - run: pnpm invariants:check

  catalog-state:
    # THE NAME CARRIES "(main only)" ON PURPOSE — do not shorten it.
    #
    # This job is skipped on every pull request by design (see the `if:`
    # below), and a bare "catalog-state staleness: SKIPPED" in a PR's check
    # list explains nothing. Four separate sessions have read that SKIPPED,
    # gone looking for a reason, landed on the comment below this one, and
    # reported to Ana that CI has no Supabase secrets. It has had them since
    # 2026-07-28. The status line now states the reason itself, so nobody has
    # to infer one.
    name: catalog-state staleness (main only)
    # Reads the live catalog, so it needs the service role key. Never on
    # pull_request: a PR-triggered job that can read SUPABASE_SERVICE_ROLE_KEY
    # widens the blast radius of any workflow edit for no benefit. Drift is
    # caught on the push to main immediately after merge.
    #
    # THIS `if:` IS THE ONLY REASON A PR SEES THIS JOB SKIPPED. It is not the
    # secrets, it is not the shell guard further down. Verify with
    # `gh secret list` before repeating any claim about which secrets exist.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check docs/catalog-state.md against the live catalog
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # BOTH REPO SECRETS EXIST (added 2026-07-28) and this step runs for
        # real on every push to main. It is not a no-op and has not been one
        # since that date — `gh secret list` is the check, and this comment is
        # not evidence of anything.
        #
        # A missing key therefore means somebody REMOVED it, which is a broken
        # staleness gate, not a pending setup task. So it FAILS here rather
        # than printing a notice and exiting 0. The old silent `exit 0` is what
        # made "CI has no secrets" survive four tellings: a green run and a
        # skipped run looked identical from the outside.
        #
        # The secrets context is not available in job- or step-level `if:`, so
        # this check has to happen inside the shell.
        run: |
          if [ -z "$SERVICE_ROLE" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set, so docs/catalog-state.md" \
                 "cannot be checked against the live catalog. Both secrets have existed" \
                 "since 2026-07-28, so this means one was removed — restore it with" \
                 "'gh secret set SUPABASE_SERVICE_ROLE_KEY'. Do NOT report this as CI" \
                 "never having had secrets; run 'gh secret list' first."
            exit 1
          fi
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$SUPABASE_URL" "$SERVICE_ROLE" > apps/web/.env.local
          pnpm --filter santolina-web catalog:state:check

  migration-drift:
    # SAME "(main only)" CONVENTION AS THE JOB ABOVE, for the same reason — a
    # bare SKIPPED in a PR's check list sent four sessions hunting for a cause
    # and produced a false "CI has no secrets" claim each time. The status line
    # states its own reason. Do not shorten this name.
    #
    # A SEPARATE JOB rather than a step on catalog-state: these fail for
    # unrelated reasons and a failure named "catalog-state staleness" when the
    # real defect is an unapplied migration is the same class of misleading
    # status line.
    name: migration drift (main only)
    # Trap 14: a migration committed to main and never applied. The check reads
    # the remote's own ledger, so it needs the service role key and can never
    # run on pull_request — same trade as catalog-state above.
    #
    # THIS `if:` IS THE ONLY REASON A PR SEES THIS JOB SKIPPED. Not the
    # secrets: `gh secret list` settles that in one command.
    #
    # Main-only is the right timing on its own merits, not a compromise.
    # Migrations here are applied by hand through the MCP around the moment a
    # PR merges, so a PR-time check would be asking the question before the
    # answer exists. The push to main straight after the merge is exactly when
    # "did anyone actually apply it?" is worth asking — which is the day-long
    # window trap 14 slipped through.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check supabase/migrations against the remote ledger
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Fails rather than exiting 0 on a missing key, for the reason spelled
        # out on the job above: a silent skip and a real pass looked identical
        # from outside, and that is what let a stale claim survive four
        # tellings. A missing key means somebody removed it.
        run: |
          if [ -z "$SERVICE_ROLE" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set, so" \
                 "supabase/migrations cannot be compared against the remote" \
                 "ledger. Both secrets have existed since 2026-07-28, so this" \
                 "means one was removed — restore it with 'gh secret set" \
                 "SUPABASE_SERVICE_ROLE_KEY'. Run 'gh secret list' before" \
                 "reporting this as CI never having had secrets."
            exit 1
          fi
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$SUPABASE_URL" "$SERVICE_ROLE" > apps/web/.env.local
          pnpm --filter santolina-web migrations:check
